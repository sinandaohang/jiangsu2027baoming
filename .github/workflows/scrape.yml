name: 更新江苏省考报名数据

on:
  schedule:
    # 每小时一次。GitHub cron 为 UTC，下面表示 UTC 每小时第 7 分
    # 即北京时间每小时 :07（数据源每小时更新一次）
    - cron: "7 * * * *"
  workflow_dispatch:   # 支持在 Actions 页面手动触发
    inputs:
      mode:
        description: "运行模式"
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests beautifulsoup4 pandas openpyxl

      - name: 写入常州 Cookie
        env:
          CZ_COOKIE: ${{ secrets.CZ_COOKIE }}
        run: |
          if [ -n "$CZ_COOKIE" ]; then
            printf '#常州\n%s\n' "$CZ_COOKIE" > cookies.txt
            echo "已写入常州 Cookie"
          else
            echo "未配置 CZ_COOKIE，跳过常州（其余城市照常抓取）"
          fi

      - name: 抓取数据
        run: |
          if [ "${{ github.event.inputs.mode }}" = "smoke" ]; then
            echo "== 连通测试模式：每个城市只请求一次 =="
            python scrape.py --smoke
          else
            python scrape.py
          fi

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "江苏省2027省考报名情况.csv" "江苏省2027省考报名情况.xlsx"
          if git diff --cached --quiet -- "江苏省2027省考报名情况.csv"; then
            echo "CSV 无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 更新报名数据"
          git push
